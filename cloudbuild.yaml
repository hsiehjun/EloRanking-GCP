steps:
  # 1. Build Docker image with both $COMMIT_SHA and :latest tags
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:latest'
      - '.'

  # 2. Push image tags to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking'

  # 3. Deploy Cloud Run Web Service: elo-ranking (min-instances=1 to eliminate cold starts)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elo-ranking'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--min'
      - '1'
      - '--max'
      - '10'
      - '--cpu-throttling'
      - '--memory'
      - '2Gi'

  # 4. Update Cloud Run Job: elo-tournament-sync-job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-tournament-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'elo-tournament-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

  # 5. Update Cloud Run Job: elo-historical-scrape
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-historical-scrape-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'elo-historical-scrape'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

  # 7. Update Cloud Run Job: player-sync-job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-player-sync-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'player-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

  # 8. Create or Update Cloud Run Job + Cloud Scheduler: elo-melee-sync-job (Melee.gg TCG Sync + 10yr Backfill Execution)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-melee-sync-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-melee-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/sync_melee.py,--game-system=all,--days=3650,--max-events=6000,--time-budget-minutes=40,--skip-finalize'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '60m'
      - '--no-execute'
      - '--scheduler-name'
      - 'elo-melee-scheduler-job'
      - '--schedule'
      - '15 0 * * *'
      - '--description'
      - 'Scrapes Melee.gg tournaments (MTG, Star Wars Unlimited, Flesh and Blood, Lorcana) and recalculates Elo once a day via Cloud Run Job'

  # 9. Create or Update Cloud Run Job + Cloud Scheduler: elo-limitless-sync-job (Limitless TCG Sync + 10yr Backfill Execution)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-limitless-sync-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-limitless-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/sync_limitless.py,--game-system=all,--days=3650,--start-date=2016-01-01,--max-events=4000,--time-budget-minutes=45,--skip-finalize'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '60m'
      - '--no-execute'
      - '--scheduler-name'
      - 'elo-limitless-scheduler-job'
      - '--schedule'
      - '15 1 * * *'
      - '--description'
      - 'Scrapes LimitlessTCG tournaments (Pokemon, One Piece, Digimon, Lorcana, Star Wars Unlimited) and recalculates Elo once a day via Cloud Run Job'

  # 10. Create or Update Cloud Run Job + Cloud Scheduler: elo-longshanks-sync-job (Longshanks Tabletop Sync + 10yr Backfill Execution)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-longshanks-sync-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-longshanks-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/sync_longshanks.py,--game-system=all,--max-events=500,--time-budget-minutes=45,--defer-finalize'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '60m'
      - '--no-execute'
      - '--scheduler-name'
      - 'elo-longshanks-scheduler-job'
      - '--schedule'
      - '15 3 * * *'
      - '--description'
      - 'Scrapes Longshanks tabletop tournaments (MCP, Star Wars Legion, Shatterpoint, X-Wing, Armada, Guild Ball, Warmachine, Malifaux, Infinity, Conquest, Bolt Action, Kings of War) and recalculates Elo once a day via Cloud Run Job'

  # 11. Create or Update Cloud Run Job + Cloud Scheduler: elo-topdeck-sync-job (TopDeck.gg 4P FFA Pod & MTG Sync + 10yr Backfill Execution)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-topdeck-sync-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-topdeck-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/sync_topdeck.py,--game-system=all,--max-events=2000,--time-budget-minutes=45,--defer-finalize'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '60m'
      - '--no-execute'
      - '--scheduler-name'
      - 'elo-topdeck-scheduler-job'
      - '--schedule'
      - '15 2 * * *'
      - '--description'
      - 'Scrapes TopDeck.gg tournaments (4-player FFA Commander pods & MTG) and recalculates Elo once a day via Cloud Run Job'

  # 11b. Create or Update Cloud Run Job: elo-rebuild-job (heavy per-system Elo + journey rebuilds,
  #      triggered on demand by /api/admin/repair-matches-elo and /api/admin/run-job; never auto-executed)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-rebuild-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-rebuild-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/rebuild_ratings.py,--game-system=all_multiplatform'
      - '--scheduler-name'
      - 'elo-rebuild-scheduler-job'
      - '--schedule'
      - '0 4 * * *'
      - '--description'
      - 'Nightly Elo + journey + Meta Intel rebuild for all multiplatform card & miniature wargame systems after deferred-finalize platform sync jobs'
      - '--memory'
      - '8Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '180m'
      - '--max-retries'
      - '0'
      - '--no-execute'

  # 12. Run Sequential Production Endpoint & DB Latency Gate (<1000ms budget)
  - name: 'python:3.11-slim'
    id: 'verify-prod-performance'
    entrypoint: python3
    args:
      - 'scripts/verify_prod_performance.py'
      - '--base-url'
      - 'https://omnitactica.com'
      - '--max-ms'
      - '1000'

images:
  - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:latest'

options:
  logging: CLOUD_LOGGING_ONLY
