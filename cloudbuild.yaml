steps:
  # 1. Build Docker image with both $COMMIT_SHA and :latest tags
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:latest'
      - '.'

  # 2. Push image tags to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking'

  # 3. Deploy Cloud Run Web Service: elo-ranking (min-instances=1 to eliminate cold starts)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elo-ranking'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--min'
      - '1'
      - '--max'
      - '10'
      - '--cpu-throttling'
      - '--memory'
      - '2Gi'

  # 4. Update Cloud Run Job: elo-tournament-sync-job (BCP daily rolling-window sync)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-tournament-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'elo-tournament-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

  # 5. Create or Update Cloud Run Job + Cloud Scheduler: elo-melee-sync-job (Daily 14-day Rolling Sync)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-melee-sync-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-melee-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/sync_melee.py,--game-system=all,--days=14,--max-events=500,--time-budget-minutes=30,--skip-finalize'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '60m'
      - '--no-execute'
      - '--scheduler-name'
      - 'elo-melee-scheduler-job'
      - '--schedule'
      - '15 0 * * *'
      - '--description'
      - 'Scrapes recent Melee.gg tournaments (MTG, Star Wars Unlimited, Flesh and Blood, Lorcana, Riftbound) once a day via Cloud Run Job'

  # 6. Create or Update Cloud Run Job + Cloud Scheduler: elo-limitless-sync-job (Daily 14-day Rolling Sync)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-limitless-sync-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-limitless-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/sync_limitless.py,--game-system=all,--days=14,--max-events=500,--time-budget-minutes=30,--skip-finalize'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '60m'
      - '--no-execute'
      - '--scheduler-name'
      - 'elo-limitless-scheduler-job'
      - '--schedule'
      - '15 1 * * *'
      - '--description'
      - 'Scrapes recent LimitlessTCG tournaments (Pokemon, One Piece, Digimon, Gundam, Lorcana, Star Wars Unlimited, Riftbound) once a day via Cloud Run Job'

  # 7. Create or Update Cloud Run Job + Cloud Scheduler: elo-longshanks-sync-job (Daily 21-day Rolling Sync)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-longshanks-sync-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-longshanks-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/sync_longshanks.py,--game-system=all,--days=21,--recent-days=21,--max-backfill-systems=0,--max-events=300,--time-budget-minutes=30,--defer-finalize'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '60m'
      - '--no-execute'
      - '--scheduler-name'
      - 'elo-longshanks-scheduler-job'
      - '--schedule'
      - '15 3 * * *'
      - '--description'
      - 'Scrapes recent Longshanks tabletop tournaments across all miniature wargames once a day via Cloud Run Job'

  # 8. Create or Update Cloud Run Job + Cloud Scheduler: elo-topdeck-sync-job (Daily 14-day Rolling Sync)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-topdeck-sync-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-topdeck-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/sync_topdeck.py,--game-system=all,--days=14,--recent-days=14,--max-events=500,--time-budget-minutes=30,--defer-finalize'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '60m'
      - '--no-execute'
      - '--scheduler-name'
      - 'elo-topdeck-scheduler-job'
      - '--schedule'
      - '15 2 * * *'
      - '--description'
      - 'Scrapes recent TopDeck.gg tournaments (4-player FFA Commander pods & TCGs) once a day via Cloud Run Job'

  # 11b. Create or Update Cloud Run Job: elo-rebuild-job (auto incremental for daily appends, full chronological for historical backfills)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-rebuild-job'
    entrypoint: python3
    args:
      - 'scripts/deploy_platform_job.py'
      - '--job-name'
      - 'elo-rebuild-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--command'
      - 'python3'
      - '--args'
      - 'scripts/rebuild_ratings.py,--game-system=all_multiplatform,--mode=auto'
      - '--scheduler-name'
      - 'elo-rebuild-scheduler-job'
      - '--schedule'
      - '0 4 * * *'
      - '--description'
      - 'Nightly Elo + journey + Meta Intel rebuild for all multiplatform card & miniature wargame systems after deferred-finalize platform sync jobs'
      - '--memory'
      - '8Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '720m'
      - '--max-retries'
      - '0'
      - '--no-execute'

  # 12. Run Sequential Production Endpoint & DB Latency Gate (<1000ms budget)
  - name: 'python:3.11-slim'
    id: 'verify-prod-performance'
    entrypoint: python3
    args:
      - 'scripts/verify_prod_performance.py'
      - '--base-url'
      - 'https://omnitactica.com'
      - '--max-ms'
      - '1000'

images:
  - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:latest'

options:
  logging: CLOUD_LOGGING_ONLY
