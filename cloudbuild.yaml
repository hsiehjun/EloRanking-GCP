steps:
  # 1. Build Docker image with both $COMMIT_SHA and :latest tags
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:latest'
      - '.'

  # 2. Push image tags to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking'

  # 2b. Deploy Cloud Run NewRecruit Relay in us-west1 (clean outbound IP for live NewRecruit account RPCs)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-nr-relay'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run deploy elo-nr-relay \
          --image us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA \
          --region us-west1 \
          --platform managed \
          --allow-unauthenticated \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 4 \
          --cpu-throttling \
          --quiet || \
        gcloud run deploy elo-nr-relay \
          --image us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA \
          --region us-west1 \
          --platform managed \
          --no-allow-unauthenticated \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 4 \
          --cpu-throttling \
          --quiet || true

  # 3. Deploy Cloud Run Web Service: elo-ranking (min-instances=1 to eliminate cold starts)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elo-ranking'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--min'
      - '1'
      - '--max'
      - '10'
      - '--cpu-throttling'
      - '--update-env-vars'
      - 'NR_RELAY_URL=https://elo-nr-relay-911555823374.us-west1.run.app'

  # 4. Update Cloud Run Job: elo-tournament-sync-job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-tournament-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'elo-tournament-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

  # 5. Update Cloud Run Job: elo-historical-scrape
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-historical-scrape-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'elo-historical-scrape'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

  # 7. Update Cloud Run Job: player-sync-job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-player-sync-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'player-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

images:
  - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:latest'

options:
  logging: CLOUD_LOGGING_ONLY
