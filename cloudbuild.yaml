steps:
  # 1. Build Docker image with both $COMMIT_SHA and :latest tags
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:latest'
      - '.'

  # 2. Push image tags to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking'

  # 3. Deploy Cloud Run Web Service: elo-ranking
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'elo-ranking'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

  # 4. Update Cloud Run Job: elo-tournament-sync-job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-tournament-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'elo-tournament-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

  # 5. Update Cloud Run Job: wahapedia-sync-job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-wahapedia-job'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'wahapedia-sync-job'
      - '--image'
      - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

images:
  - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/eloranking-506820/elo-ranking/elo-ranking:latest'

options:
  logging: CLOUD_LOGGING_ONLY
