<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='100%' height='100%'>

  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#070b14'/>
      <stop offset='50%' stop-color='#0e172a'/>
      <stop offset='100%' stop-color='#050811'/>
    </linearGradient>
    <linearGradient id='goldGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#fef08a'/>
      <stop offset='30%' stop-color='#f59e0b'/>
      <stop offset='70%' stop-color='#d97706'/>
      <stop offset='100%' stop-color='#b45309'/>
    </linearGradient>
    <linearGradient id='cyanGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#e0f2fe'/>
      <stop offset='30%' stop-color='#38bdf8'/>
      <stop offset='75%' stop-color='#0284c7'/>
      <stop offset='100%' stop-color='#0369a1'/>
    </linearGradient>
    <linearGradient id='shieldGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#1e293b'/>
      <stop offset='100%' stop-color='#090d16'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='4' result='blur' />
      <feComposite in='SourceGraphic' in2='blur' operator='over' />
    </filter>
  </defs>

  <rect width='512' height='512' fill='#070b14'/>
  <g transform='translate(256, 256) scale(0.70) translate(-256, -256)'>
    
  <!-- Outer Shield Trim -->
  <polygon points='256,36 454,136 454,356 256,476 58,356 58,136' fill='url(#shieldGrad)' stroke='url(#goldGrad)' stroke-width='8' stroke-linejoin='round'/>
  <polygon points='256,56 434,148 434,344 256,454 78,344 78,148' fill='none' stroke='url(#cyanGrad)' stroke-width='3' stroke-opacity='0.6' stroke-linejoin='round'/>

  <!-- Radar Crosshairs -->
  <g opacity='0.4'>
    <circle cx='256' cy='225' r='120' fill='none' stroke='url(#cyanGrad)' stroke-width='2' stroke-dasharray='8 6'/>
    <circle cx='256' cy='225' r='65' fill='none' stroke='url(#cyanGrad)' stroke-width='1.5'/>
    <line x1='256' y1='85' x2='256' y2='365' stroke='url(#cyanGrad)' stroke-width='1.5' stroke-dasharray='4 4'/>
    <line x1='116' y1='225' x2='396' y2='225' stroke='url(#cyanGrad)' stroke-width='1.5' stroke-dasharray='4 4'/>
  </g>

  <!-- Crossed Power Swords -->
  <g opacity='0.95' filter='url(#glow)'>
    <!-- Left to Right Blade -->
    <line x1='120' y1='115' x2='392' y2='387' stroke='url(#cyanGrad)' stroke-width='9' stroke-linecap='round'/>
    <line x1='120' y1='115' x2='392' y2='387' stroke='#ffffff' stroke-width='3' stroke-linecap='round'/>
    <line x1='132' y1='157' x2='162' y2='127' stroke='url(#goldGrad)' stroke-width='12' stroke-linecap='square'/>
    <circle cx='108' cy='103' r='9' fill='url(#goldGrad)'/>

    <!-- Right to Left Blade -->
    <line x1='392' y1='115' x2='120' y2='387' stroke='url(#cyanGrad)' stroke-width='9' stroke-linecap='round'/>
    <line x1='392' y1='115' x2='120' y2='387' stroke='#ffffff' stroke-width='3' stroke-linecap='round'/>
    <line x1='380' y1='157' x2='350' y2='127' stroke='url(#goldGrad)' stroke-width='12' stroke-linecap='square'/>
    <circle cx='404' cy='103' r='9' fill='url(#goldGrad)'/>
  </g>

  <!-- Central Tactical Omega & Skull Reticle -->
  <g transform='translate(256, 215)'>
    <!-- Golden Omega -->
    <path d='M -72,50 L -42,50 C -42,50 -34,25 -22,8 C -36,-10 -46,-32 -46,-56 C -46,-96 0,-116 0,-116 C 0,-116 46,-96 46,-56 C 46,-32 36,-10 22,8 C 34,25 42,50 42,50 L 72,50' 
          fill='none' stroke='url(#goldGrad)' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' filter='url(#glow)'/>

    <!-- Cyan Inner Omega -->
    <path d='M -68,50 L -44,50 C -44,50 -37,28 -24,12 C -37,-4 -44,-24 -44,-48 C -44,-84 0,-102 0,-102 C 0,-102 44,-84 44,-48 C 44,-24 37,-4 24,12 C 37,28 44,50 44,50 L 68,50' 
          fill='none' stroke='url(#cyanGrad)' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/>

    <!-- Reticle Center -->
    <circle cx='0' cy='-46' r='30' fill='#070b14' stroke='url(#cyanGrad)' stroke-width='4' filter='url(#glow)'/>
    <polygon points='0,-66 18,-46 0,-26 -18,-46' fill='none' stroke='url(#goldGrad)' stroke-width='3'/>
    <circle cx='0' cy='-46' r='7' fill='#38bdf8' filter='url(#glow)'/>
    <circle cx='0' cy='-46' r='3' fill='#ffffff'/>
  </g>

  <!-- OMNI Plaque -->
  <g transform='translate(256, 110)'>
    <polygon points='-80,-18 80,-18 92,12 78,20 -78,20 -92,12' fill='#070b14' stroke='url(#goldGrad)' stroke-width='3'/>
    <text x='0' y='9' font-family='sans-serif' font-size='22' font-weight='900' letter-spacing='8' fill='#fbbf24' text-anchor='middle'>OMNI</text>
  </g>

  <!-- TACTICA Main Banner -->
  <g transform='translate(256, 395)'>
    <polygon points='-165,-25 165,-25 190,16 0,46 -190,16' fill='#070b14' stroke='url(#cyanGrad)' stroke-width='4'/>
    <polygon points='-152,-19 152,-19 174,14 0,40 -174,14' fill='rgba(2,132,199,0.2)'/>
    <text x='0' y='11' font-family='sans-serif' font-size='34' font-weight='900' letter-spacing='9' fill='#ffffff' text-anchor='middle' filter='url(#glow)'>TACTICA</text>
    <text x='0' y='29' font-family='monospace' font-size='10' font-weight='800' letter-spacing='4' fill='#38bdf8' text-anchor='middle'>40K SUITE</text>
  </g>

  </g>
</svg>