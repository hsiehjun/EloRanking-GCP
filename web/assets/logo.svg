<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Icon Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="16 8"/>

  <!-- Tactical Hex Shield -->
  <polygon points="256,44 444,142 444,352 256,468 68,352 68,142" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="256,62 426,152 426,342 256,448 86,342 86,152" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-opacity="0.5" stroke-linejoin="round"/>

  <!-- Tactical Radar Crosshair Grid -->
  <g opacity="0.4">
    <circle cx="256" cy="225" r="120" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="256" cy="225" r="65" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <line x1="256" y1="95" x2="256" y2="355" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="126" y1="225" x2="386" y2="225" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Dual Crossed Energy Blades / Laurel -->
  <g opacity="0.9" filter="url(#cyanGlow)">
    <!-- Blade 1 -->
    <line x1="130" y1="125" x2="382" y2="377" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="130" y1="125" x2="382" y2="377" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="165" x2="170" y2="135" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="square"/>
    <circle cx="118" cy="113" r="8" fill="url(#goldGrad)"/>

    <!-- Blade 2 -->
    <line x1="382" y1="125" x2="130" y2="377" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="382" y1="125" x2="130" y2="377" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="372" y1="165" x2="342" y2="135" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="square"/>
    <circle cx="394" cy="113" r="8" fill="url(#goldGrad)"/>
  </g>

  <!-- Central Emblem: Tactical Greek Omega (Ω) + Imperial Skull & Chevron -->
  <g transform="translate(256, 215)">
    <!-- Outer Golden Omega Halo -->
    <path d="M -70,50 L -40,50 C -40,50 -32,25 -20,8 C -35,-10 -45,-32 -45,-55 C -45,-95 0,-115 0,-115 C 0,-115 45,-95 45,-55 C 45,-32 35,-10 20,8 C 32,25 40,50 40,50 L 70,50" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)"/>

    <!-- Inner Neon Cyan Omega -->
    <path d="M -66,50 L -42,50 C -42,50 -35,28 -22,12 C -35,-4 -42,-24 -42,-48 C -42,-84 0,-102 0,-102 C 0,-102 42,-84 42,-48 C 42,-24 35,-4 22,12 C 35,28 42,50 42,50 L 66,50" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Tactical Reticle / Skull Icon -->
    <circle cx="0" cy="-45" r="28" fill="#0b1120" stroke="url(#cyanGrad)" stroke-width="3.5" filter="url(#cyanGlow)"/>
    <polygon points="0,-64 16,-45 0,-26 -16,-45" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="-45" r="6" fill="#38bdf8" filter="url(#cyanGlow)"/>
    <circle cx="0" cy="-45" r="2.5" fill="#ffffff"/>

    <!-- Tactical Target Brackets -->
    <path d="M -18,-54 L -23,-54 L -23,-49" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 18,-54 L 23,-54 L 23,-49" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M -18,-36 L -23,-36 L -23,-41" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 18,-36 L 23,-36 L 23,-41" fill="none" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- OMNI Brand Plaque -->
  <g transform="translate(256, 115)">
    <polygon points="-75,-16 75,-16 88,10 75,18 -75,18 -88,10" fill="#080c18" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <text x="0" y="8" font-family="'Inter', 'JetBrains Mono', 'Segoe UI', sans-serif" font-size="22" font-weight="900" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">OMNI</text>
  </g>

  <!-- TACTICA Main Title Plaque -->
  <g transform="translate(256, 388)">
    <!-- Hex Banner Background -->
    <polygon points="-160,-24 160,-24 185,16 0,44 -185,16" fill="#070b16" stroke="url(#cyanGrad)" stroke-width="3.5"/>
    <polygon points="-148,-18 148,-18 170,14 0,38 -170,14" fill="rgba(2,132,199,0.15)"/>
    
    <!-- TACTICA Lettering -->
    <text x="0" y="10" font-family="'Inter', 'JetBrains Mono', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="9" fill="#ffffff" text-anchor="middle" filter="url(#cyanGlow)">TACTICA</text>
    <text x="0" y="27" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="9.5" font-weight="800" letter-spacing="4" fill="#38bdf8" text-anchor="middle">WARHAMMER 40K</text>
  </g>

  <!-- Corner Precision Accents -->
  <circle cx="256" cy="44" r="4" fill="#38bdf8"/>
  <circle cx="444" cy="142" r="4" fill="#38bdf8"/>
  <circle cx="444" cy="352" r="4" fill="#38bdf8"/>
  <circle cx="256" cy="468" r="4" fill="#38bdf8"/>
  <circle cx="68" cy="352" r="4" fill="#38bdf8"/>
  <circle cx="68" cy="142" r="4" fill="#38bdf8"/>
</svg>
