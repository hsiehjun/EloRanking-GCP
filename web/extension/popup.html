<!DOCTYPE html>
<html>
<head>
  <meta charset=utf-8>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1329;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      font-size: 20px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
    }
    .status {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #10b981;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 0;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class=header>
    <div class=logo>⚡</div>
    <div class=title>OmniTactica BCP Bridge</div>
  </div>
  <div class=status>
    🟢 <b>Bridge Active</b><br>
    Auto-syncs BCP login with OmniTactica Event Studio.
  </div>
  <a href=https://omnitactica.com/#event-studio target=_blank class=btn>Open OmniTactica</a>
</body>
</html>
