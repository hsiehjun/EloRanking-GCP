<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS Live Broadcast Overlay • OmniTactica</title>
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: var(--font-sans);
      color: #fff;
    }
    body.browser-preview-bg {
      background: radial-gradient(circle at 50% 35%, #0f172a 0%, #020617 100%) !important;
    }
    .preview-helper-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(168, 85, 247, 0.45);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 0.8rem;
      color: #e2e8f0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }
    .preview-helper-btn {
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #38bdf8;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .preview-helper-btn:hover {
      background: rgba(56, 189, 248, 0.28);
    }
    .overlay-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
    }
    .lower-third-bar {
      width: 100%;
      max-width: 1680px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.94), rgba(30, 41, 59, 0.94));
      border: 2px solid rgba(56, 189, 248, 0.55);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      border-radius: 12px;
      padding: 16px 28px;
      gap: 20px;
    }
    .player-side {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1;
    }
    .player-side.right {
      justify-content: flex-end;
      text-align: right;
    }
    .table-badge {
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .table-badge.p1 {
      background: #38bdf8;
      color: #020617;
    }
    .table-badge.p2 {
      background: #f43f5e;
      color: #fff;
    }
    .player-name {
      font-weight: 800;
      font-size: 1.35rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-meta {
      font-size: 0.92rem;
      font-weight: 600;
      margin-top: 3px;
    }
    .player-meta.p1 { color: #38bdf8; }
    .player-meta.p2 { color: #fb7185; }
    .score-box {
      font-family: var(--font-mono);
      font-weight: 900;
      font-size: 2.1rem;
      color: #f59e0b;
      padding: 6px 24px;
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 10px;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.1;
    }
    .score-sub {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .tale-card {
      width: 100%;
      max-width: 960px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
      border: 2px solid rgba(168, 85, 247, 0.6);
      border-radius: 14px;
      padding: 22px 28px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
    }
    .tale-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .prob-bar-track {
      width: 100%;
      height: 10px;
      background: rgba(244, 63, 94, 0.85);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }
    .prob-bar-fill {
      height: 100%;
      background: #38bdf8;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="preview-helper-bar" class="preview-helper-bar">
    <span>📺 <strong>OBS Browser Source Overlay</strong> — Add this URL in OBS Studio as a <strong>Browser Source</strong> (Width: <code>1920</code>, Height: <code>250</code>)</span>
    <button type="button" class="preview-helper-btn" onclick="copyCurrentOverlayUrl(this)">📋 Copy URL</button>
    <button type="button" class="preview-helper-btn" onclick="togglePreviewBg()">🌗 Toggle Backdrop</button>
    <button type="button" class="preview-helper-btn" onclick="hidePreviewBar()" style="border-color:rgba(255,255,255,0.2); color:#94a3b8; background:transparent;">✕ Hide</button>
  </div>
  <div id="overlay-root" class="overlay-wrapper"></div>
  <script>
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function initBrowserPreviewMode() {
      const params = new URLSearchParams(window.location.search);
      const isObs = Boolean(window.obsstudio) || params.get('obs') === '1' || params.get('clean') === '1' || window.self !== window.top;
      if (!isObs) {
        document.body.classList.add('browser-preview-bg');
        const bar = document.getElementById('preview-helper-bar');
        if (bar) bar.style.display = 'flex';
      }
    }

    function togglePreviewBg() {
      document.body.classList.toggle('browser-preview-bg');
    }

    function hidePreviewBar() {
      document.body.classList.remove('browser-preview-bg');
      const bar = document.getElementById('preview-helper-bar');
      if (bar) bar.style.display = 'none';
    }

    function copyCurrentOverlayUrl(btn) {
      const url = window.location.href;
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(url).then(() => {
          if (btn) {
            const orig = btn.textContent;
            btn.textContent = '✓ Copied!';
            setTimeout(() => { btn.textContent = orig; }, 2000);
          }
        }).catch(() => {});
      }
    }

    async function refreshOverlay() {
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get('event') || 'ev_ongoing_gt_live';
      let tableNum = parseInt(params.get('table') ?? '1', 10);
      let reqRound = parseInt(params.get('round') ?? '0', 10);
      const followCaster = params.get('follow') === 'caster' || params.get('sync') === '1';
      const overlayType = (params.get('type') || 'lower_third').toLowerCase();

      const rootEl = document.getElementById('overlay-root');
      if (rootEl && !rootEl.innerHTML.trim()) {
        const initBadge = tableNum === 0 ? 'MAIN DESK' : `TABLE ${isNaN(tableNum) ? 1 : tableNum}`;
        rootEl.innerHTML = `
          <div class="lower-third-bar" style="opacity:0.85;">
            <div class="player-side">
              <span class="table-badge p1">${escapeHtml(initBadge)}</span>
              <div>
                <div class="player-name">Syncing Live Telemetry...</div>
                <div class="player-meta p1">Connecting to Tournament Feed</div>
              </div>
            </div>
            <div class="score-box"><span>LIVE</span></div>
            <div class="player-side right">
              <div>
                <div class="player-name">OmniTactica Broadcast HUD</div>
                <div class="player-meta p2">${escapeHtml(eventId)}</div>
              </div>
              <span class="table-badge p2">${escapeHtml(initBadge)}</span>
            </div>
          </div>
        `;
      }

      try {
        const [evRes, streamRes] = await Promise.all([
          fetch(`/api/event/${encodeURIComponent(eventId)}`, { cache: 'no-store' }),
          fetch(`/api/events/${encodeURIComponent(eventId)}/livestreams`, { cache: 'no-store' }).catch(() => null)
        ]);
        const ev = evRes && evRes.ok ? await evRes.json() : {};
        const streamsPayload = (streamRes && streamRes.ok) ? await streamRes.json().catch(() => ({})) : {};
        const streams = Array.isArray(streamsPayload) ? streamsPayload : (Array.isArray(streamsPayload.livestreams) ? streamsPayload.livestreams : []);

        // If follow=caster is enabled (or stream sync), sync table & round from the active broadcaster stream if available
        if (followCaster && streams.length > 0) {
          const activeStream = streams[0];
          if (activeStream.table_number !== undefined && activeStream.table_number !== null) {
            tableNum = parseInt(activeStream.table_number, 10);
          }
          if (activeStream.round_number && parseInt(activeStream.round_number, 10) > 0) {
            reqRound = parseInt(activeStream.round_number, 10);
          }
        } else if (!reqRound && streams.length > 0) {
          const matchingStream = streams.find(s => Number(s.table_number) === tableNum);
          if (matchingStream && matchingStream.round_number && parseInt(matchingStream.round_number, 10) > 0) {
            reqRound = parseInt(matchingStream.round_number, 10);
          }
        }

        const players = Array.isArray(ev.players) ? ev.players : [];
        const matches = Array.isArray(ev.matches) ? ev.matches : [];
        const matchRounds = [...new Set(matches.map(m => Number(m.round)).filter(r => r > 0))].sort((a, b) => a - b);

        let curRound = reqRound > 0 ? reqRound : 0;
        if (!curRound) {
          if (ev.current_round && matches.some(m => Number(m.round) === Number(ev.current_round))) {
            curRound = Number(ev.current_round);
          } else if (matchRounds.length > 0) {
            curRound = matchRounds[matchRounds.length - 1];
          } else {
            curRound = Number(ev.current_round) || 1;
          }
        }

        const roundMatches = matches.filter(m => Number(m.round || 1) === curRound);
        let match = tableNum === 0
          ? (roundMatches.find(m => Number(m.table_number || m.table) === 1) || roundMatches[0] || null)
          : (roundMatches.find(m => Number(m.table_number || m.table) === tableNum) || null);

        // Smart fallback: if the requested table didn't play in curRound (e.g., Top Cut pod round 10 only uses Tables 1-8, while Table 208 played in Swiss Rounds 1-6),
        // find the match on tableNum from the latest round where tableNum was active
        if (!match && tableNum > 0) {
          const tableHistory = matches
            .filter(m => Number(m.table_number || m.table) === tableNum)
            .sort((a, b) => Number(b.round || 1) - Number(a.round || 1));
          if (tableHistory.length > 0) {
            match = tableHistory.find(m => m.player1_score !== null && m.player1_score !== undefined) || tableHistory[0];
            curRound = Number(match.round || curRound || 1);
          }
        }

        // Check live Game Tracker scorecard for real-time turn-by-turn scores on this table
        let trackerStatusLabel = '';
        let liveP1Score = match ? match.player1_score : null;
        let liveP2Score = match ? match.player2_score : null;
        const effectiveTable = tableNum === 0 ? (match ? Number(match.table_number || match.table || 1) : 1) : tableNum;
        if (effectiveTable > 0 && curRound > 0) {
          try {
            const matchId = `BCP-${eventId}-R${curRound}-T${effectiveTable}`;
            const scRes = await fetch(`/api/scorecard/${encodeURIComponent(matchId)}`, { cache: 'no-store' });
            if (scRes.ok) {
              const scData = await scRes.json();
              const sc = scData.scorecard || scData;
              if (sc && (sc.has_tracker_data || sc.source === 'tracker_db' || sc.source === 'live_room')) {
                if (sc.p1_score !== undefined && sc.p1_score !== null) liveP1Score = sc.p1_score;
                if (sc.p2_score !== undefined && sc.p2_score !== null) liveP2Score = sc.p2_score;
                if (sc.current_round) {
                  trackerStatusLabel = sc.is_finished ? 'FINAL (TRACKER)' : `BATTLE ROUND ${sc.current_round}/5`;
                }
              }
            }
          } catch (scErr) {
            // Ignore scorecard lookup error
          }
        }

        const findPlayer = (pid, pname) =>
          players.find(p => (pid && String(p.player_id || p.id) === String(pid)) || (pname && p.full_name === pname)) || null;

        const p1 = match ? findPlayer(match.player1_id, match.player1_name) : null;
        const p2 = match ? findPlayer(match.player2_id, match.player2_name) : null;

        const tableBadge = tableNum === 0 ? 'MAIN DESK' : `TABLE ${isNaN(tableNum) ? 1 : tableNum}`;
        const p1Name = match ? (p1?.full_name || match.player1_name || 'Player 1') : (tableNum === 0 ? 'Main Desk' : 'Player 1 (TBD)');
        const p2Name = match ? (p2?.full_name || match.player2_name || 'Player 2') : (tableNum === 0 ? 'Broadcast' : 'Player 2 (TBD)');
        const p1Fac = match ? (p1?.faction || match.player1_faction || 'Army') : (tableNum === 0 ? 'All Tables' : 'TBD');
        const p2Fac = match ? (p2?.faction || match.player2_faction || 'Army') : (tableNum === 0 ? 'Coverage' : 'TBD');
        const p1Elo = match ? Number(match.player1_elo || p1?.current_elo || 1500) : 1500;
        const p2Elo = match ? Number(match.player2_elo || p2?.current_elo || 1500) : 1500;
        const hasScore = liveP1Score !== null && liveP1Score !== undefined && liveP2Score !== null && liveP2Score !== undefined;
        const scoreStr = hasScore ? `${liveP1Score} - ${liveP2Score}` : (tableNum === 0 && !match ? 'LIVE' : '0 - 0');

        const eloDiff = p2Elo - p1Elo;
        const p1WinProb = Math.min(95, Math.max(5, Math.round(100 / (1 + Math.pow(10, eloDiff / 400)))));
        const p2WinProb = 100 - p1WinProb;

        const root = document.getElementById('overlay-root');
        if (!root) return;

        if (overlayType === 'tale_of_tape') {
          root.innerHTML = `
            <div class="tale-card">
              <div class="tale-header">
                <span id="lt-table-badge">⚔️ ${escapeHtml(ev.name || 'Tournament Broadcast')} • ${escapeHtml(tableBadge)}</span>
                <span id="lt-round">ROUND ${curRound} • WIN PROBABILITY ${p1WinProb}% - ${p2WinProb}%</span>
              </div>
              <div style="display:flex; align-items:center; justify-content:space-between; gap:20px;">
                <div class="player-side">
                  <span class="table-badge p1">${escapeHtml(tableBadge)}</span>
                  <div>
                    <div id="lt-p1-name" class="player-name">${escapeHtml(p1Name)} (${escapeHtml(p1Fac)})</div>
                    <div class="player-meta p1">${p1Elo.toFixed(1)} Elo • ${p1WinProb}% Win Prob</div>
                  </div>
                </div>
                <div class="score-box">
                  <span id="lt-score">${escapeHtml(scoreStr)}</span>
                  ${trackerStatusLabel ? `<span class="score-sub">${escapeHtml(trackerStatusLabel)}</span>` : ''}
                </div>
                <div class="player-side right">
                  <div>
                    <div id="lt-p2-name" class="player-name">${escapeHtml(p2Name)} (${escapeHtml(p2Fac)})</div>
                    <div class="player-meta p2">${p2Elo.toFixed(1)} Elo • ${p2WinProb}% Win Prob</div>
                  </div>
                  <span class="table-badge p2">${escapeHtml(tableBadge)}</span>
                </div>
              </div>
              <div class="prob-bar-track">
                <div class="prob-bar-fill" style="width:${p1WinProb}%;"></div>
              </div>
            </div>
          `;
        } else {
          root.innerHTML = `
            <div class="lower-third-bar">
              <div class="player-side">
                <span id="lt-table-badge" class="table-badge p1">${escapeHtml(tableBadge)}</span>
                <div>
                  <div id="lt-p1-name" class="player-name">${escapeHtml(p1Name)} (${escapeHtml(p1Fac)})</div>
                  <div id="lt-round" class="player-meta p1">${p1Elo.toFixed(1)} Elo • Round ${curRound}</div>
                </div>
              </div>
              <div class="score-box">
                <span id="lt-score">${escapeHtml(scoreStr)}</span>
                ${trackerStatusLabel ? `<span class="score-sub">${escapeHtml(trackerStatusLabel)}</span>` : ''}
              </div>
              <div class="player-side right">
                <div>
                  <div id="lt-p2-name" class="player-name">${escapeHtml(p2Name)} (${escapeHtml(p2Fac)})</div>
                  <div class="player-meta p2">${p2Elo.toFixed(1)} Elo • Round ${curRound}</div>
                </div>
                <span class="table-badge p2">${escapeHtml(tableBadge)}</span>
              </div>
            </div>
          `;
        }
      } catch (err) {
        console.error('Overlay refresh failed:', err);
      }
    }

    initBrowserPreviewMode();
    refreshOverlay();
    setInterval(refreshOverlay, 10000);
  </script>
</body>
</html>
