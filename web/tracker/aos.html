  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#f59e0b',
              blue: '#38bdf8',
              dark: '#070b14',
              card: '#12161f',
              tile: '#181d28',
              border: '#273042'
            }
          }
        }
      }
    };
  </script>

  <!-- Synchronous iOS Safe-Area Detector -->
  <script>
    (function() {
      try {
        var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIos) {
          document.documentElement.classList.add('is-ios');
          if (('standalone' in window.navigator && window.navigator.standalone) ||
              (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) {
            document.documentElement.classList.add('is-ios-standalone');
          }
        }
      } catch (e) {}
    })();
  </script>

  <!-- DECOUPLED AOS REAL-TIME SYNC OVERLAY -->
  <script src="/tracker/tracker_sync_aos.js?v=1.0"></script>

  <style>
    :root {
      --gtk-accent: #f59e0b;
      --gtk-panel: #12161f;
      --gtk-tile: #181d28;
      --gtk-line: #273042;
      --gtk-text: #f0f4fc;
      --gtk-muted: #94a3b8;
      --bg-primary: #070b14;
      --bg-secondary: #12161f;
      --bg-card: #181d28;
      --border: #273042;
      --text-primary: #f0f4fc;
      --text-secondary: #94a3b8;
      --accent: #f59e0b;
      --p1: #3b82f6;
      --p2: #ef4444;
    }
    body {

        linear-gradient(to right, rgba(245, 158, 11, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(245, 158, 11, 0.02) 1px, transparent 1px) !important;
      background-size: 40px 40px !important;
    }
  </style>
</head>
<body class="antialiased is-tracker-aos">
  <div id="root"></div>
  <script src="/tracker/bundle_aos.js?v=1.0"></script>
</body>
</html>
