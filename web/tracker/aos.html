  <script>
    (function() {
      var _lastVerCheck = 0, _isReloading = false;

          window.caches.delete('newrecruit').catch(function() {});
        }
      } catch (e) {}
      try {
        var curUrl = new URL(window.location.href);
        var urlV = curUrl.searchParams.get('_v');
        var hasUpd = curUrl.searchParams.has('_upd');
        var inlineV = (typeof window.APP_VERSION === 'string' && window.APP_VERSION !== 'dev') ? window.APP_VERSION.trim() : null;
        if ((urlV && (!inlineV || urlV === inlineV)) || hasUpd) {
          curUrl.searchParams.delete('_v');
          curUrl.searchParams.delete('_upd');
          window.history.replaceState(null, '', curUrl.pathname + curUrl.search + curUrl.hash);
        }
      } catch (e) {}
      function verifyLiveServerVersion(force) {
        var now = Date.now();
        if (!force && (now - _lastVerCheck < 15000)) return;
        _lastVerCheck = now;
        fetch('/api/version?_t=' + now, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' } })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(data) {
            if (!data || !data.version) return;
            var serverVer = String(data.version).trim();
            if (!serverVer || serverVer === 'dev') return;
            var prev = null;
            try { prev = localStorage.getItem('omnitactica_live_version'); } catch (e) {}
            var inlineVer = (typeof window.APP_VERSION === 'string' && window.APP_VERSION !== 'dev') ? window.APP_VERSION.trim() : null;
            var isStale = (inlineVer && inlineVer !== serverVer) || (prev && prev !== serverVer);
            try { localStorage.setItem('omnitactica_live_version', serverVer); } catch (e) {}
            if (isStale && !_isReloading) {
              var alreadyReloaded = null;
              try { alreadyReloaded = sessionStorage.getItem('omnitactica_reloaded_ver'); } catch (e) {}
              if (alreadyReloaded !== serverVer) {
                _isReloading = true;
                try { sessionStorage.setItem('omnitactica_reloaded_ver', serverVer); } catch (e) {}
                var bust = function() {
                  var u = new URL(window.location.href);
                  u.searchParams.set('_v', serverVer);
                  window.location.replace(u.toString());
                };
                var tasks = [];
                if ('caches' in window && window.caches) {
                  tasks.push(caches.keys().then(function(keys) { return Promise.all(keys.map(function(k) { return caches.delete(k); })); }).catch(function() {}));
                }
                if ('serviceWorker' in navigator && navigator.serviceWorker && typeof navigator.serviceWorker.getRegistrations === 'function') {

                }
                if (tasks.length > 0) { Promise.all(tasks).finally(bust); } else { bust(); }
              }
            }
          }).catch(function() {});
      }

      verifyLiveServerVersion(true);
      window.addEventListener('pageshow', function() { verifyLiveServerVersion(true); });
      document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'visible') verifyLiveServerVersion(true); });
      window.addEventListener('focus', function() { verifyLiveServerVersion(false); });
      window.addEventListener('online', function() { verifyLiveServerVersion(true); });
      setInterval(function() { if (document.visibilityState === 'visible') verifyLiveServerVersion(false); }, 60000);
    })();
  </script>

  <script>
    (function() {
      try {
        var raw = sessionStorage.getItem('gt_room_handoff');
        if (raw) {
          var h = JSON.parse(raw);
          var p = new URLSearchParams(window.location.search);
          var mid = (p.get('match_id') || p.get('room') || '').toUpperCase();
          if (h && h.matchId && h.matchId.toUpperCase() === mid && (Date.now() - (h.ts || 0)) < 15000 && p.get('role') !== 'spectator') {
            document.body.classList.add('gt-role-verified');
            var ov = document.getElementById('gt-loading-overlay');
            if (ov) {
              ov.classList.add('gt-loading-hidden');
              ov.style.opacity = '0';
              ov.style.visibility = 'hidden';
              ov.style.pointerEvents = 'none';
            }
          }
        }
      } catch (e) {}
    })();
  </script>
