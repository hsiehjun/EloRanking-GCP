<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Game Tracker • Age of Sigmar | OmniTactica</title>
  <meta name="description" content="Set up and track a game of Warhammer: Age of Sigmar 4th edition (GHB 2024-2025): pick battleplans, roll priority, execute tactical gambits, and record victory points." />
  <link rel="manifest" href="/manifest.json?v=3.0">
  <meta name="theme-color" content="#070b14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OmniTactica AoS">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/_next/static/css/664dc56ac1c88016.css" />
  <link rel="stylesheet" href="/_next/static/css/9f99d55fbe42acec.css" />
  <link rel="stylesheet" href="/_next/static/css/32ff1ff2177a7837.css" />
  <link rel="stylesheet" href="/tracker/tracker_sync.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#f59e0b',
              blue: '#38bdf8',
              dark: '#070b14',
              card: '#12161f',
              tile: '#181d28',
              border: '#273042'
            }
          }
        }
      }
    };
  </script>

  <!-- Synchronous iOS Safe-Area Detector -->
  <script>
    (function() {
      try {
        var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIos) {
          document.documentElement.classList.add('is-ios');
          if (('standalone' in window.navigator && window.navigator.standalone) ||
              (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) {
            document.documentElement.classList.add('is-ios-standalone');
          }
        }
      } catch (e) {}
    })();
  </script>

  <!-- Cloud Firestore SDK for Real-Time Match Sync -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- DECOUPLED AOS REAL-TIME SYNC OVERLAY -->
  <script src="/js/armory_svgs.js"></script>
  <script src="/js/armory.js"></script>
  <script src="/tracker/tracker_sync_aos.js?v=1.2"></script>

  <style>
    :root {
      --gtk-display: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
      --gtk-mono: 'JetBrains Mono', ui-monospace, monospace;
      --font-jetbrains-mono: 'JetBrains Mono', monospace;
      --gtk-accent: #f59e0b;
      --gtk-panel: #12161f;
      --gtk-tile: #181d28;
      --gtk-line: #273042;
      --gtk-text: #f0f4fc;
      --gtk-muted: #94a3b8;
      --bg-primary: #070b14;
      --bg-secondary: #12161f;
      --bg-card: #181d28;
      --border: #273042;
      --text-primary: #f0f4fc;
      --text-secondary: #94a3b8;
      --accent: #f59e0b;
      --p1: #3b82f6;
      --p2: #ef4444;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #070b14 !important;
      color: #f0f4fc !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-image:
        linear-gradient(to right, rgba(245, 158, 11, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(245, 158, 11, 0.02) 1px, transparent 1px) !important;
      background-size: 40px 40px !important;
    }
    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    html, body, #root, * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    @keyframes gtLobbySpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes gtLobbyPulse {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(0.98); }
    }
    #gt-loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 999990;
      background: radial-gradient(circle at 50% 35%, rgba(18, 26, 44, 0.96), rgba(7, 11, 20, 0.99));
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }
    #gt-loading-overlay.gt-loading-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    body.is-tracker-aos:not(.gt-role-verified) #root,
    body.is-tracker-aos:not(.gt-role-verified) #aos-sync-hud,
    body.is-tracker-aos:not(.gt-role-verified) #gt-mobile-bottom-dock {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body class="antialiased is-tracker-aos">
  <div id="gt-loading-overlay">
    <div style="background: rgba(18, 22, 31, 0.92); border: 1px solid rgba(245, 158, 11, 0.28); border-radius: 20px; padding: 32px 28px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 40px rgba(245, 158, 11, 0.08);">
      <div style="position: relative; width: 58px; height: 58px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;">
        <div style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(245, 158, 11, 0.16); border-top-color: #f59e0b; border-right-color: #38bdf8; animation: gtLobbySpin 0.9s linear infinite;"></div>
        <span style="font-size: 24px; animation: gtLobbyPulse 1.8s ease-in-out infinite;">⚡</span>
      </div>
      <div id="gt-loading-title" style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; color: #f8fafc; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;">
        Initializing AoS Tabletop
      </div>
      <div id="gt-loading-subtitle" style="font-size: 12px; color: #94a3b8; line-height: 1.45;">
        Verifying player seat, battleplan &amp; command telemetry...
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script src="/tracker/bundle_aos.js?v=1.3"></script>
</body>
</html>
